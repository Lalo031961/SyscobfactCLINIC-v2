    /* Pantalla de Login — mismo patrón de clases (variables, .field,

async function cargarClinicaInfo(){
  if(!CLINICA_ID) return;

function fl(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ff(f){if(!f)return'---';return new Date(f+'T12:00:00').toLocaleDateString('es-PA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function ffc(f){if(!f)return'---';return new Date(f+'T12:00:00').toLocaleDateString('es-PA',{weekday:'short',day:'numeric',month:'short'});}
function sal(){const h=new Date().getHours();return h<12?'Buenos dias':h<19?'Buenas tardes':'Buenas noches';}
function fah(){return new Date().toLocaleDateString('es-PA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}

// SHA-256 vía Web Crypto (nativo del navegador) — mismo helper que
// Login/index.html y Register/index.html, así el hash se calcula igual en
// toda la app. v1 no hasheaba acá: la comparación de contraseña la hacía
// una RPC de Postgres (autenticar_paciente) que no existe en v2 — acá se
// compara el hash directo contra pacientes.password, mismo patrón que
// usuarios_clinica.
async function sha256Hex(texto) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function toast(msg,type){
  let t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);color:#fff;padding:14px 24px;border-radius:12px;font-size:.78rem;font-weight:600;z-index:9999;transition:transform .3s;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw;text-align:center';document.body.appendChild(t);}
  t.style.background=type==='err'?'#dc2626':T.gr;
  t.textContent=msg;
  t.style.transform='translateX(-50%) translateY(0)';
  setTimeout(()=>{t.style.transform='translateX(-50%) translateY(120px)';},3200);
}

function pw(a,b){const i=document.getElementById(a),bt=document.getElementById(b);if(i.type==='password'){i.type='text';bt.textContent='👁️';}else{i.type='password';bt.textContent='👁️‍🗨️';}}

function logout(){

}

async function cargar(){
  const id=sessionStorage.getItem('paciente_id');if(!id)return;
  try{
    const {data:p}=await db.from('pacientes').select('*').eq('id',id).single();
    if(p)pac=p;
    const {data:c}=await db.from('citas').select('*').eq('paciente_id',id).eq('clinica_id',CLINICA_ID).order('fecha',{ascending:true});
    citas=c||[];
    const {data:n}=await db.from('notificaciones').select('*').eq('clinica_id',CLINICA_ID).eq('leida',false).order('created_at',{ascending:false});
    notifs=n||[];
    const {data:m}=await db.from('medicos').select('*').eq('clinica_id',CLINICA_ID).eq('estado','activo');
    medicos=m||[];
    // Mi Historial / Mis Recetas / Mis Exámenes — tablas reales confirmadas:
    // historial_clinico, recetas, examenes (examenes_medicos NO existe).
    const {data:h}=await db.from('historial_clinico').select('*').eq('paciente_id',id).eq('clinica_id',CLINICA_ID).order('fecha',{ascending:false});
    historial=h||[];
    const {data:r}=await db.from('recetas').select('*').eq('paciente_id',id).eq('clinica_id',CLINICA_ID).order('fecha',{ascending:false});
    recetas=r||[];
    const {data:ex}=await db.from('examenes').select('*').eq('paciente_id',id).eq('clinica_id',CLINICA_ID).order('fecha',{ascending:false});
    examenes=ex||[];
  }catch(e){console.error(e);}
}

function nombreMedico(medicoId, nombreManual){
  const m=medicos.find(x=>x.id===medicoId);
  return m?m.nombre_completo:(nombreManual||'---');
}


// Guarda la sesión con prefijo paciente_ EN sessionStorage (no
// localStorage) — exactamente las 6 claves pedidas, sin paciente_rol (a
// diferencia de Login/index.html, este portal solo tiene un tipo de
// sesión, no necesita distinguirlo por rol). sessionStorage es exclusivo
// de cada pestaña: si dos pacientes de clínicas (o cuentas) distintas
// inician sesión en pestañas distintas del mismo navegador, nunca se
// pisan la sesión ni ven datos médicos ajenos — mismo fix aplicado a
// Dashboard/index.html y DashboardMedico/index.html tras encontrar la
// misma fuga entre clínicas tratándose de admins.
function guardarSesion(p){
  sessionStorage.setItem('paciente_clinica_id',p.clinica_id);
  sessionStorage.setItem('paciente_id',p.id);
  sessionStorage.setItem('paciente_nombre',p.nombre_completo);
  sessionStorage.setItem('paciente_cedula',p.cedula||'');
  sessionStorage.setItem('paciente_email',p.email||'');
  sessionStorage.setItem('paciente_tipo','paciente');
  CLINICA_ID=p.clinica_id;
}

// Login con cédula + contraseña — busca en TODAS las clínicas (ya no hay
// ?clinica_id= en la URL que acote la búsqueda a una sola). clinica_id se
// resuelve DESPUÉS de autenticar, leyéndolo de la fila que matchea; recién
// ahí se sabe a qué clínica pertenece este paciente (ver guardarSesion()).
// Caso de colisión real (poco común, pero pasa en Panamá: el mismo
// paciente atendido en más de una clínica que usa este sistema, con la
// MISMA contraseña en ambas) — se detecta explícitamente contando filas
// en vez de usar .maybeSingle() (que fallaría con el error crudo de
// Postgres) y se le pide que contacte a su clínica en vez de mostrarle
// un error genérico.
async function login(e){
  e.preventDefault();
  const ced=document.getElementById('lced').value.trim();
  const pw2=document.getElementById('lpw').value;
  const err=document.getElementById('lerr');
  const btn=document.getElementById('lbtn');
  if(!ced||!pw2){err.textContent='Complete todos los campos';err.style.display='block';return;}
  btn.disabled=true;btn.innerHTML='<div class="spinner" style="border-top-color:#fff"></div> Verificando...';err.style.display='none';
  try{
    const passwordHash=await sha256Hex(pw2);
    const {data:coincidencias,error}=await db.from('pacientes').select('*')
      .eq('cedula',ced).eq('password',passwordHash).eq('estado','activo');
    if(error){err.textContent=error.message;err.style.display='block';return;}
    if(!coincidencias||coincidencias.length===0){err.textContent='Cédula o contraseña incorrectos.';err.style.display='block';return;}
    if(coincidencias.length>1){err.textContent='Su cédula está registrada en más de una clínica con la misma contraseña. Por favor contacte a su clínica para resolver esta situación.';err.style.display='block';return;}
    const p=coincidencias[0];
    guardarSesion(p);
    await cargarClinicaInfo();
    await cargar();
    toast('Bienvenido/a '+p.nombre_completo);
    go('dash');
  }catch(er){err.textContent='Error al iniciar sesion';err.style.display='block';}
  finally{btn.disabled=false;btn.innerHTML='🔐 Iniciar Sesión';}
}

  ${headerPortal()}
  <div style="padding:20px">
    <h1 style="font-size:1.15rem;font-weight:700;color:#1e293b;margin-bottom:2px">📅 Mis Citas</h1>
    <p style="font-size:.75rem;color:#64748b;margin-bottom:16px">Historial de citas en la clínica</p>
    ${citas.length===0?`<div style="background:#fff;border-radius:14px;padding:20px;text-align:center;border:1.5px dashed ${T.lt}"><p style="color:#94a3b8;font-size:.82rem">No tienes citas registradas</p></div>`:''}
    ${prox.length>0?`<p style="font-size:.85rem;font-weight:700;color:#1e293b;margin-bottom:10px">Próximas</p>${prox.map(c=>{
      const md=medicos.find(m=>m.id===c.medico_id);
      const ec=c.estado==='confirmada'?'#5B85C2':'#f59e0b';
      const el=c.estado==='confirmada'?'Confirmada':'Pendiente';
      return `<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid ${ec};box-shadow:0 2px 8px rgba(26,86,160,.08)"><div style="display:flex;align-items:flex-start;justify-content:space-between"><div><div style="font-weight:700;color:#1e293b;font-size:.85rem;margin-bottom:6px">📅 ${ff(c.fecha)}</div><div style="font-size:.78rem;color:#475569;margin-bottom:4px">🕐 ${c.hora}</div><div style="font-size:.72rem;color:#64748b">🩺 ${md?md.nombre_completo:'---'}</div>${c.motivo?`<div style="font-size:.7rem;color:#94a3b8;margin-top:3px">📝 ${c.motivo}</div>`:''}</div><span style="background:${c.estado==='confirmada'?'#DCE6F5':'#fef9c3'};color:${ec};padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap">${el}</span></div></div>`;}).join('')}`:''}
    ${atend.length>0?`<p style="font-size:.85rem;font-weight:700;color:#1e293b;margin-bottom:10px;margin-top:8px">Atendidas</p>${atend.map(c=>`<div style="background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;opacity:.75;border-left:4px solid #94a3b8"><div style="font-size:.82rem;color:#475569;font-weight:600">${ff(c.fecha)}</div><div style="font-size:.72rem;color:#94a3b8;margin-top:3px">${c.motivo||'Consulta'}</div><span style="background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:700;margin-top:6px;display:inline-block">🩺 Atendida</span></div>`).join('')}`:''}
  </div>
  ${navInferior('citas')}
  </div>`;
}

function rMiHistorial(){
  return `<div style="min-height:100vh;background:${T.bg};padding-bottom:100px">
  ${headerPortal()}
  <div style="padding:20px">
    <h1 style="font-size:1.15rem;font-weight:700;color:#1e293b;margin-bottom:2px">📋 Mi Historial</h1>
    <p style="font-size:.75rem;color:#64748b;margin-bottom:16px">Consultas y diagnósticos registrados</p>
    ${historial.length===0?`<div style="background:#fff;border-radius:14px;padding:20px;text-align:center;border:1.5px dashed ${T.lt}"><p style="color:#94a3b8;font-size:.82rem">Sin historial clínico registrado</p></div>`
    :historial.map(h=>{
      const signos=[h.peso?`Peso: ${h.peso} kg`:'',h.estatura?`Estatura: ${h.estatura} m`:'',h.presion?`Presión: ${h.presion}`:'',h.temperatura?`Temp: ${h.temperatura}°C`:''].filter(Boolean).join(' · ');
      return `<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid ${T.p};box-shadow:0 2px 8px rgba(26,86,160,.08)">
        <div style="font-weight:700;color:#1e293b;font-size:.85rem;margin-bottom:4px">📅 ${ff(h.fecha)}</div>
        <div style="font-size:.72rem;color:#64748b;margin-bottom:8px">🩺 ${nombreMedico(h.medico_id,h.medico_nombre_manual)}</div>
        ${h.diagnostico?`<div style="font-size:.78rem;color:#1e293b;margin-bottom:4px"><strong>Diagnóstico:</strong> ${h.diagnostico}</div>`:''}
        ${h.tratamiento?`<div style="font-size:.78rem;color:#475569;margin-bottom:4px"><strong>Tratamiento:</strong> ${h.tratamiento}</div>`:''}
        ${h.sintomas?`<div style="font-size:.75rem;color:#64748b;margin-bottom:4px"><strong>Síntomas:</strong> ${h.sintomas}</div>`:''}
        ${h.observaciones?`<div style="font-size:.75rem;color:#64748b;margin-bottom:4px">${h.observaciones}</div>`:''}
        ${signos?`<div style="font-size:.68rem;color:#94a3b8;margin-top:6px;padding-top:6px;border-top:1px solid ${T.lt}">${signos}</div>`:''}
      </div>`;}).join('')}
  </div>
  ${navInferior('historial')}
  </div>`;
}

function rMisRecetas(){
  return `<div style="min-height:100vh;background:${T.bg};padding-bottom:100px">
  ${headerPortal()}
  <div style="padding:20px">
    <h1 style="font-size:1.15rem;font-weight:700;color:#1e293b;margin-bottom:2px">💊 Mis Recetas</h1>
    <p style="font-size:.75rem;color:#64748b;margin-bottom:16px">Medicamentos recetados por tu médico</p>
    ${recetas.length===0?`<div style="background:#fff;border-radius:14px;padding:20px;text-align:center;border:1.5px dashed ${T.lt}"><p style="color:#94a3b8;font-size:.82rem">Sin recetas registradas</p></div>`
    :recetas.map(r=>`<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid ${T.p};box-shadow:0 2px 8px rgba(26,86,160,.08)">
      <div style="font-weight:700;color:#1e293b;font-size:.88rem;margin-bottom:4px">💊 ${r.medicamento}</div>
      <div style="font-size:.78rem;color:#475569;margin-bottom:4px">${r.dosis||'---'} · ${r.frecuencia||'---'}</div>
      <div style="font-size:.7rem;color:#64748b">📅 ${ff(r.fecha)} · 🩺 ${nombreMedico(r.medico_id)}</div>
    </div>`).join('')}
  </div>
  ${navInferior('recetas')}
  </div>`;
}

function rMisExamenes(){
  return `<div style="min-height:100vh;background:${T.bg};padding-bottom:100px">
  ${headerPortal()}
  <div style="padding:20px">
    <h1 style="font-size:1.15rem;font-weight:700;color:#1e293b;margin-bottom:2px">🔬 Mis Exámenes</h1>
    <p style="font-size:.75rem;color:#64748b;margin-bottom:16px">Exámenes solicitados y resultados</p>
    ${examenes.length===0?`<div style="background:#fff;border-radius:14px;padding:20px;text-align:center;border:1.5px dashed ${T.lt}"><p style="color:#94a3b8;font-size:.82rem">Sin exámenes registrados</p></div>`
    :examenes.map(e=>`<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border-left:4px solid ${T.p};box-shadow:0 2px 8px rgba(26,86,160,.08)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">
        <div style="font-weight:700;color:#1e293b;font-size:.85rem">🔬 ${e.tipo}</div>
        <span style="background:${e.resultado_texto?'#DCE6F5':'#fef9c3'};color:${e.resultado_texto?T.p:'#f59e0b'};padding:3px 10px;border-radius:20px;font-size:.65rem;font-weight:700;white-space:nowrap">${e.resultado_texto?'Completado':'Pendiente'}</span>
      </div>
      <div style="font-size:.7rem;color:#64748b;margin-bottom:6px">📅 ${ff(e.fecha)} · 🩺 ${nombreMedico(e.medico_id)}</div>
      ${e.resultado_texto?`<div style="font-size:.75rem;color:#475569;margin-bottom:4px">${e.resultado_texto}</div>`:''}
      ${e.interpretacion?`<div style="font-size:.75rem;color:#1e293b"><strong>Interpretación:</strong> ${e.interpretacion}</div>`:''}
    </div>`).join('')}
  </div>
  ${navInferior('examenes')}
  </div>`;
}

function rNotifs(){
  return `<div style="min-height:100vh;background:${T.bg}">
  <div style="background:${T.hd};padding:20px">
    <button onclick="go('dash')" style="display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;margin-bottom:12px"><span style="font-size:1.2rem">‹</span><span style="font-size:.85rem;color:#475569;font-weight:600">Volver</span></button>
    <h1 style="font-size:1.2rem;font-weight:700;color:#1e293b">🔔 Avisos de la Clinica</h1>
  </div>
  <div style="padding:20px">
    ${notifs.length>0?notifs.map(n=>`<div style="background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border-left:4px solid ${T.p};box-shadow:0 2px 8px rgba(26,86,160,.08)"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div style="flex:1"><div style="font-size:.82rem;font-weight:700;color:#1e293b;margin-bottom:6px">${n.titulo}</div><div style="font-size:.78rem;color:#475569;line-height:1.5">${n.mensaje}</div><div style="font-size:.65rem;color:#94a3b8;margin-top:8px">${new Date(n.created_at).toLocaleDateString('es-PA',{day:'2-digit',month:'long',year:'numeric'})}</div></div><button onclick="marcarLeida('${n.id}')" style="background:${T.lt};color:${T.dk};border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.68rem;font-weight:700;white-space:nowrap;flex-shrink:0">Leido</button></div></div>`).join('')
    :`<div style="background:#fff;border-radius:14px;padding:30px;text-align:center"><div style="font-size:2rem;margin-bottom:10px">🔔</div><p style="color:#94a3b8;font-size:.85rem">Sin avisos nuevos</p><p style="color:#64748b;font-size:.78rem;margin-top:4px">Aqui apareceran los mensajes de su clinica</p></div>`}
  </div></div>`;
}

function render(){
  const app=document.getElementById('app');
  switch(view){
    case 'login':     app.innerHTML=rLogin();      break;
    case 'dash':      app.innerHTML=rDash();       break;
    case 'citas':     app.innerHTML=rMisCitas();   break;
    case 'historial': app.innerHTML=rMiHistorial();break;
    case 'recetas':   app.innerHTML=rMisRecetas(); break;
    case 'examenes':  app.innerHTML=rMisExamenes();break;
    case 'notifs':    app.innerHTML=rNotifs();     break;
    default:          app.innerHTML=rLogin();
  }
}

// Sesión guardada en esta misma pestaña (paciente_id + paciente_clinica_id
// en sessionStorage) restaura el dashboard directo; si no hay sesión, se
// muestra el login con la marca genérica (clinicaInfo aún no se resuelve
// sin CLINICA_ID — ver login()).
async function init(){
  const id=sessionStorage.getItem('paciente_id');
  if(id && CLINICA_ID){
    await cargarClinicaInfo();
    await cargar();
    go('dash');
  } else {
    go('login');
  }
}
init();
</script>
</body>
</html>
